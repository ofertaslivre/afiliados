<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ofertas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<div id="topo"></div>
<section class="hero" id="hero"></section>
<div id="promoBox"></div>
<div class="cats" id="cats"></div>
<div class="chips" id="chips"></div>
<main id="conteudo"></main>
<div id="grupoBox"></div>
<footer class="rodape" id="rodape"></footer>
<script src="/site.js"></script>
<script>
function ir(i){const ss=[...document.querySelectorAll('.slide')];atual=i;ss.forEach((s,k)=>s.classList.toggle('on',k===i));[...$('pontos').children].forEach((b,k)=>b.classList.toggle('on',k===i))}
function iniciar(){clearInterval(timer);const n=document.querySelectorAll('.slide').length;if(n>1&&!matchMedia('(prefers-reduced-motion:reduce)').matches)timer=setInterval(()=>ir((atual+1)%n),5000)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(!b)return;lojaF=b.dataset.l;desenharConteudo()});
function desenharConteudo(){
  document.querySelectorAll('#topo nav button').forEach(b=>b.classList.toggle('on',b.dataset.f===filtro));
  const vis=CFG.ofertas.filter(viva),usadas=[...new Set(vis.map(o=>o.loja))];
  $('chips').innerHTML=vis.length?`<button class="chip ${lojaF==='todas'?'on':''}" data-l="todas">Todas as lojas</button>`+usadas.map(k=>`<button class="chip ${lojaF===k?'on':''}" data-l="${esc(k)}">${esc((LOJAS[k]||LOJAS.outra).nome)}</button>`).join(''):'';
  let h='';
  if(filtro!=='todos'||busca||lojaF!=='todas'){
    const l=vis.filter(o=>(filtro==='todos'||o.cat===filtro)&&(lojaF==='todas'||o.loja===lojaF)&&(!busca||o.nome.toLowerCase().includes(busca)));
    const t=busca?'Resultados para "'+esc(busca)+'"':[(CFG.categorias.find(c=>c.id===filtro)||{}).nome,lojaF!=='todas'&&(LOJAS[lojaF]||LOJAS.outra).nome].filter(Boolean).map(esc).join(' · ')||'Ofertas';
    h=`<h2>${t}</h2><div class="grade">${l.map(card).join('')||'<p class="vazio">Nenhuma oferta encontrada.</p>'}</div>`;
  }else[1,2].forEach(n=>{const s=CFG['secao'+n]||{},l=vis.filter(o=>+o.secao===n);if(s.ativa!==false&&l.length)h+=`<h2>${esc(s.titulo)}</h2><div class="grade">${l.map(card).join('')}</div>`});
  $('conteudo').innerHTML=h||'<p class="vazio">Novas ofertas em breve!</p>';
}
function grupoHTML(){const G=CFG.grupo||{};
  return `<section class="grupo" id="grupo"><div><h2>${esc(G.titulo)}</h2><p>${esc(G.texto)}</p></div>
  <form id="fg"><input type="text" name="site" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
   <input type="text" id="fgn" placeholder="Seu nome" autocomplete="name" required><input type="tel" id="fgt" placeholder="Seu WhatsApp com DDD" inputmode="tel" autocomplete="tel" required>
   <div class="int">${CFG.categorias.map(c=>`<label><input type="checkbox" value="${esc(c.nome)}"> ${esc(c.nome)}</label>`).join('')}</div>
   <label class="aceite"><input type="checkbox" id="fgc"> Aceito receber ofertas pelo WhatsApp e sei que posso sair do grupo quando quiser.</label>
   <button class="btn grande">Quero entrar no grupo</button><small id="fgm"></small><small>${esc(G.aviso)}</small></form></section>`}
iniciarSite(()=>{
  const cs=CFG.categorias.slice(0,6),sl=CFG.carrossel.filter(s=>s.ativo!==false);
  const tile=c=>`<button class="tile" data-f="${esc(c.id)}" style="${bg(c)}"><span>${esc(c.nome)}</span></button>`;
  $('hero').innerHTML=`<div class="lado">${cs.slice(0,3).map(tile).join('')}</div>
   <div class="rot" id="rot">${sl.map((s,i)=>{const u=seguro(s.link),ext=https(u);return `<div class="slide s${i%3+1}" ${s.foto?`style="background-image:linear-gradient(90deg,#000b,#0000),url('${esc(s.foto)}')"`:''}><small>${esc(s.sub)}</small><h2>${esc(s.titulo)}</h2><p>${esc(s.texto)}</p>${s.botao?`<a class="cta" href="${esc(u)}"${ext?' target="_blank" rel="sponsored noopener"':''}>${esc(s.botao)}</a>`:''}</div>`}).join('')}<div class="pontos" id="pontos"></div></div>
   <div class="lado">${cs.slice(3,6).map(tile).join('')}</div>`;
  document.querySelectorAll('.slide').forEach((_,i)=>{const b=document.createElement('button');b.setAttribute('aria-label','Banner '+(i+1));b.onclick=()=>{ir(i);iniciar()};$('pontos').appendChild(b)});
  $('rot').onmouseenter=()=>clearInterval(timer);$('rot').onmouseleave=iniciar;ir(0);iniciar();
  $('cats').innerHTML=CFG.categorias.map(c=>`<button class="cat" data-f="${esc(c.id)}"><i style="${bg(c)}">${c.foto?'':esc(c.nome[0])}</i>${esc(c.nome)}</button>`).join('');
  desenharConteudo();
  if(!$('fg')){$('grupoBox').innerHTML=grupoHTML();
    $('fg').onsubmit=async e=>{e.preventDefault();const m=$('fgm');
      const body={nome:$('fgn').value,tel:$('fgt').value,consent:$('fgc').checked,site:e.target.site.value,interesses:[...e.target.querySelectorAll('.int input:checked')].map(x=>x.value)};
      m.textContent='Enviando…';
      try{const r=await fetch('/api/contato',{method:'POST',body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.erro);
        m.textContent=d.grupo?'Cadastro feito! Abrindo o grupo…':'Cadastro feito! Em breve você recebe o link do grupo.';
        if(d.grupo)setTimeout(()=>{location.href=d.grupo},1200)}
      catch(err){m.textContent=err.message}}}
});
</script>
</body>
</html>
